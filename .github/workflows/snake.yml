name: Gerar gráfico de contribuições

on:
  schedule:
    - cron: "0 */12 * * *" # atualiza a cada 12 horas
  workflow_dispatch: # permite rodar manualmente pela aba Actions
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gerar a cobrinha
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#C8E89E&color_dots=#161b22,#3b2a66,#5a37b0,#7044d8,#8147F6
            dist/snake-light.svg?color_snake=#8147F6&color_dots=#ebedf0,#e0d4fd,#c2a7fb,#a07af8,#8147F6

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
